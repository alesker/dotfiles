[tools]
# borrower-wp-core requires Node >=26.7; databricks-marketing requires Python <=3.13.
node = "26"
python = "3.13"
# Shared DOTNET_ROOT: without global.json, dotnet selects the highest installed SDK.
dotnet = ["10", "8"]

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node", "python", "dotnet"]
